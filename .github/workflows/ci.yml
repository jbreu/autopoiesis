name: CI

on:
  push:
    branches: [main, "ai/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .autopoiesis/requirements-dev.txt
      - run: python -m pip install -r .autopoiesis/requirements-dev.txt
      - run: sh .autopoiesis/scripts/check.sh
      - name: Build and smoke-test the distributable
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv /tmp/poc-installed
          /tmp/poc-installed/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/poc-installed/bin/repo-demo "hello world"

  container:
    name: Container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .autopoiesis
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated runtime configuration
        run: python3 scripts/init_env.py
      - name: Validate Compose and build the development image
        run: |
          docker compose config --quiet
          docker compose build
      - name: Start the web interface
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify the mounted development environment
        run: |
          docker compose exec -T agent sh .autopoiesis/scripts/check.sh
          docker compose exec -T agent python3 .autopoiesis/scripts/smoke_container.py
          docker compose exec -T agent git status --short
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop CI containers
        if: always()
        run: docker compose down --volumes
