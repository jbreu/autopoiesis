[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autopoiesis-demo"
version = "0.1.0"
description = "Small text statistics CLI for experimenting with an autonomous development agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
repo-demo = "repo_demo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
